rendering_note: >-
  The release-notes pages render their version tables client-side; the Markdown export of each
  page (developer.unico.io serves a .md twin of every page) returns only the heading and the
  semver best-practice note, with no entries. The dated version history below is therefore
  read from the package registries Unico publishes to, which carry the same releases with
  authoritative dates.
