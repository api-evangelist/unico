platform_changelog_note: >-
  There is NO changelog for the REST platform itself. Unico publishes dated release notes per
  SDK, but nothing that records changes to the API contracts, the webhook payloads or the
  result vocabularies — which is exactly where its breaking changes land (the Identity
  Verification upgrade guide describes a response-semantics change delivered on the same v1
  path, with no changelog entry to find it in).
