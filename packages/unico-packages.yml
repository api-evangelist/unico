note: >-
  Unico's client libraries are CAPTURE SDKs, not API clients. They open the camera, run
  liveness and framing on-device, and hand back an encrypted payload; the REST call to
  api.id.unico.app or api.idcloud.unico.app is still written by hand. There is no first-party
  server-side SDK in any language — no Node, Python, Java, Go, .NET, PHP or Ruby client for
  the IDCloud REST contracts exists on any registry. Versions and dates below were read from
  each registry's own metadata endpoint on 2026-09-02.
