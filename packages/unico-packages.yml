  note: >-
    NOT on Maven Central — Unico self-hosts the artifact repository at maven-sdk.unico.run.
    The 6.10.0 POM returns HTTP 200 there, but the repository serves no maven-metadata.xml
    (HTTP 200 carrying a JSON "Requested entity was not found" body), so there is no
    machine-readable version index and no publish timestamp to read: `published: null` is
    checked-and-absent, not unchecked. A consumer cannot discover the latest version
    programmatically; they must read the docs page. The com.acesso group and acessobio-android
    artifact name are legacy Acesso Digital branding, confirmed as current in Unico's own docs.
