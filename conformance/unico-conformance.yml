- id: iso-42001
  name: ISO/IEC 42001 (AI management system)
  conforms: claimed
  evidence:
    url: https://www.unico.io/platforms/security-compliance
    detail: >-
      Named on Unico's Certifications & Standards page under AI Governance. This is a domain
      standard that matters for a biometric decisioning vendor — the buyer's question is
      whether the model governance is externally audited.
- id: nist-frte
  name: NIST face recognition evaluation
  conforms: claimed
  evidence:
    url: https://www.unico.io/platforms/security-compliance
    detail: >-
      Stated as "Tested by NIST" under Face Recognition. No FRTE/FRVT report identifier or
      rank is published on the page, so this is recorded as a claim, not a verified placement.
- id: presentation-attack-detection
  name: Biometric presentation-attack detection testing
  conforms: claimed
  evidence:
    url: https://www.unico.io/platforms/security-compliance
    detail: >-
      iBeta Level 1 and Level 2, and BixeLab Levels 1-3, are named for Presentation Attack
      Detection. Unico does not name the underlying ISO/IEC 30107-3 test on this page, so only
      the lab and level are recorded here.
