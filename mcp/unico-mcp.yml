tool_count: 8
agent_readiness_note: >-
  The blocker for an agent here is not the missing MCP server — it is that the platform
  publishes no machine-readable contract at all, has no idempotency key, has no reversal
  operation, and carries its verification verdict in a 200 body under a field name that
  differs per contract. Any MCP server built on this, first-party or not, has to encode those
  four facts by hand.
