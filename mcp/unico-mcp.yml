tools:
- name: create_process
  description: >-
    Create an identity verification process by sending a captured selfie directly. Returns the
    verdict synchronously.
  rest:
    method: POST
    path: /processes/v1
    host: https://api.id.unico.app
  inputs: [subject.duiType, subject.code, subject.name, subject.gender, subject.birthDate,
    subject.email, subject.phone, subject.clientReference, useCase, subsidiaryId, imageBase64]
  confidence: high
  source: https://developer.unico.io/developers/api-reference/api/post-processes
  caution: >-
    Non-idempotent and non-reversible. See conventions/unico-conventions.yml — there is no
    idempotency key and no cancel operation, so a retried call creates a second billable
    verification against a real person.
