aid: unico
name: Unico
description: >-
  Unico (unico IDtech) is a Brazilian identity-technology company whose IDCloud platform
  performs facial-biometric identity verification, liveness detection, document capture and
  OCR, and fraud-risk decisioning for customer onboarding, step-up authentication and
  card-not-present payment verification. Founded out of Acesso Digital and headquartered in
  Sao Paulo with offices in Mexico City, Londrina and Menlo Park, it has raised roughly
  $338M across four rounds and states it processes 150M+ transactions per month on Google
  Cloud. Its public developer surface is two REST contracts — an API contract where the
  integrator owns the camera and sends the selfie in the request, and a Web & SDK contract
  where Unico hosts the whole verification journey — plus an outbound webhook, four native
  capture SDKs, and three published Postman collections. It publishes no OpenAPI: the
  developer portal's own OpenAPI page reads "Placeholder OpenAPI specification."
