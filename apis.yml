- aid: unico:idcloud-web-sdk
  name: Unico IDCloud Web & SDK API
  description: >-
    The Web & SDK contract — used when Unico hosts the verification journey. The process is
    created before capture; the response carries a userRedirectUrl the end user is sent to by
    iFrame or redirect, plus an SDK token for the native capture libraries. The result is
    delivered asynchronously by webhook or retrieved by polling GetProcess.
  humanURL: https://developer.unico.io/developers/api-reference/web-sdk/
  baseURL: https://api.idcloud.unico.app
  tags:
  - Identity Verification
  - Biometrics
  - Onboarding
  - Liveness Detection
  properties:
  - type: Documentation
    url: https://developer.unico.io/developers/api-reference/web-sdk/
  - type: Authentication
    url: authentication/unico-authentication.yml
  - type: Webhooks
    url: asyncapi/unico-webhooks.yml
  - type: PostmanCollection
    url: postman/unico-web-sdk-integration.postman_collection.json
- aid: unico:identity-oauth2
  name: Unico Identity OAuth2
  description: >-
    The OAuth2 token service every IDCloud contract authenticates against. Implements the
    RFC 7523 JWT-bearer grant with an RS256-signed assertion exchanged for a one-hour access
    token, and serves a live OpenID Connect discovery document. Served from acesso.io, Unico's
    own former Acesso Digital domain, which Unico's published Environments page names as the
    production token host for every contract.
  humanURL: https://developer.unico.io/developers/api-reference/authentication
  baseURL: https://identity.acesso.io
  tags:
  - Authentication
  - OpenID Connect
  tags_raw:
