apis:
- aid: unico:idcloud-api
  name: Unico IDCloud API
  description: >-
    The API contract (internally TCA / Check.Integration) — used when the integrator's own
    application owns the biometric capture and sends the image directly in the request. The
    verification result returns synchronously in the creation response. Requires both an
    Authorization Bearer token and a provisioned APIKEY header, where the API key selects the
    active product (Onboarding, Transactional, Cardholder Verification) and the capability
    recipe executed.
  humanURL: https://developer.unico.io/developers/api-reference/api/
  baseURL: https://api.id.unico.app
  tags:
  - Identity Verification
  - Biometrics
  - KYC
  - Fraud Prevention
